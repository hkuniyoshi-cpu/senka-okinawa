<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E2C2A">
<title>株式会社選家 ブログ</title>
<meta name="description" content="株式会社選家 からのお知らせ・最新情報">
<meta http-equiv="content-language" content="ja">

<meta property="og:type" content="article">
<meta property="og:site_name" content="株式会社選家">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://senka-okinawa.search-mania.net/ogp.svg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&family=Caveat:wght@400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#FBF5F1;
  color:#3E2C2A;
  font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
header{
  background:#3E2C2A;
  padding:18px 20px;
  text-align:center;
  border-bottom:1px solid rgba(214,154,166,.3);
  position:sticky;top:0;z-index:10;
}
header a{
  color:#FBF5F1;
  text-decoration:none;
  font-size:17px;
  letter-spacing:.36em;
  font-family:'Playfair Display',serif;
  font-weight:700;
}
.wrap{
  max-width:760px;
  margin:60px auto;
  padding:0 24px 80px;
}
.loading{
  text-align:center;padding:120px 0;
  color:#B8A5A0;font-size:13px;letter-spacing:.2em;
  font-family:'Playfair Display',serif;font-style:italic;
}
.loading::after{
  content:'Loading ...';
  display:block;animation:fade 1.4s ease-in-out infinite;
}
@keyframes fade{0%,100%{opacity:.4}50%{opacity:1}}

.card{
  background:#FFFFFF;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(184,120,130,.12);
  border:1px solid rgba(214,154,166,.15);
}
.card img{
  width:100%;
  display:block;
  max-height:500px;
  object-fit:cover;
}
.card-body{padding:40px 42px 46px}
.card .date{
  font-size:12px;
  color:#B87882;
  letter-spacing:.22em;
  font-family:'Playfair Display',serif;font-style:italic;
  display:block;
}
.card h1{
  margin:14px 0 28px;
  font-size:23px;
  line-height:1.7;
  font-weight:700;
  font-family:'Playfair Display','Noto Serif JP',serif;
  color:#3E2C2A;
  letter-spacing:.04em;
  padding-bottom:16px;
  border-bottom:1px solid rgba(214,154,166,.3);
}
.card .text{
  font-size:15px;
  line-height:2.05;
  white-space:pre-wrap;
  color:#6E5652;
  word-break:break-word;
}

.back-wrap{margin-top:54px;text-align:center}
.back-btn{
  display:inline-block;
  padding:15px 38px;
  border:1.5px solid #B87882;
  color:#B87882;
  text-decoration:none;
  border-radius:999px;
  font-size:12px;
  letter-spacing:.22em;
  font-weight:700;
  transition:all .35s ease;
}
.back-btn:hover{background:#B87882;color:#FBF5F1}

.not-found{
  text-align:center;padding:90px 24px;
}
.not-found h1{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:18px;color:#3E2C2A;letter-spacing:.04em}
.not-found p{font-size:14px;color:#B8A5A0;margin-bottom:36px;line-height:1.9}

.produced-by{
  text-align:center;
  margin-top:64px;
  font-size:11px;
  letter-spacing:.28em;
  color:rgba(62,44,42,.4);
  font-family:'Playfair Display',serif;font-style:italic;
}
.produced-by a{color:rgba(62,44,42,.6);text-decoration:none;transition:color .3s ease;border-bottom:1px solid rgba(184,120,130,.3)}
.produced-by a:hover{color:#B87882}

@media (max-width:600px){
  .wrap{margin:30px auto;padding:0 16px 60px}
  .card-body{padding:28px 22px 34px}
  .card h1{font-size:19px;margin:12px 0 22px}
  .card .text{font-size:14.5px;line-height:1.95}
  header a{font-size:14px;letter-spacing:.28em}
  .back-btn{padding:13px 28px;font-size:12px}
}
</style>
</head>
<body>

<header><a href="https://senka-okinawa.search-mania.net/">株式会社選家</a></header>

<div class="wrap" id="root">
  <div class="loading"></div>
</div>

<script>
const GAS_URL    = 'https://script.google.com/macros/s/AKfycbyXDNmyeDp2ee89jmWB8eOXKEIqmrPv2wrVLBnfQ04Wv14X16S0LP1WlXS-wQV-p8X5/exec';
const SITE_URL   = 'https://senka-okinawa.search-mania.net';
const STORE_NAME = '株式会社選家';

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmtDate(s) {
  if (!s) return '';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1] + '.' + m[2] + '.' + m[3] : String(s);
}
function driveImg(url) {
  if (!url) return '';
  const s = String(url).trim();
  const m1 = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m1) return 'https://drive.google.com/thumbnail?id=' + m1[1] + '&sz=w1200';
  const m2 = s.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
  if (m2) return 'https://lh3.googleusercontent.com/d/' + m2[1] + '=w1200';
  if (s.indexOf('drive.google.com/thumbnail') !== -1) {
    return s.replace(/([?&]sz=)[^&]*/, '$1w1200');
  }
  return s;
}
function getSlug() {
  const params = new URLSearchParams(location.search);
  if (params.get('post')) return params.get('post');
  const m = location.pathname.match(/\/blog\/([^\/]+)\/?$/);
  return m ? m[1] : '';
}
function getN() {
  const params = new URLSearchParams(location.search);
  const n = params.get('n');
  return (n !== null && n !== '') ? parseInt(n, 10) : -1;
}
function findBySlug(items, slug, n) {
  if (!Array.isArray(items)) return null;
  if (n >= 0 && n < items.length && items[n]) return items[n];
  if (!slug) return null;
  return items.find(function(b) {
    if (!b) return false;
    if (b.url && (
      b.url.indexOf('/blog/' + slug + '/') !== -1 ||
      b.url.indexOf('/blog/' + slug) !== -1
    )) return true;
    if (b.date) {
      var d = String(b.date).replace(/[\/\.]/g, '-').replace(/[^0-9-]/g, '');
      if (d === slug) return true;
    }
    return false;
  }) || null;
}
function updateMeta(title, desc, imgUrl) {
  document.title = title + ' | ' + STORE_NAME;
  const m1 = document.querySelector('meta[name="description"]');
  if (m1) m1.setAttribute('content', desc);
  function upsertMeta(attrName, attrValue, contentValue) {
    let el = document.querySelector('meta[' + attrName + '="' + attrValue + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(attrName, attrValue);
      document.head.appendChild(el);
    }
    el.setAttribute('content', contentValue);
  }
  upsertMeta('property', 'og:title', title);
  upsertMeta('property', 'og:description', desc);
  upsertMeta('property', 'og:url', SITE_URL + location.pathname + location.search);
  upsertMeta('name', 'twitter:title', title);
  upsertMeta('name', 'twitter:description', desc);
  if (imgUrl) {
    upsertMeta('property', 'og:image', imgUrl);
    upsertMeta('name', 'twitter:image', imgUrl);
  }
  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement('link');
    canonical.setAttribute('rel', 'canonical');
    document.head.appendChild(canonical);
  }
  canonical.setAttribute('href', SITE_URL + location.pathname + location.search);
}
function render(item) {
  const root = document.getElementById('root');
  if (!item) {
    root.innerHTML =
      '<div class="not-found">' +
        '<h1>記事が見つかりません</h1>' +
        '<p>指定された記事は削除されたか、URLが正しくない可能性があります。</p>' +
        '<a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a>' +
      '</div>';
    document.title = '記事が見つかりません | ' + STORE_NAME;
    return;
  }
  const imgUrl = driveImg(item.image);
  let title = (item.title || '').trim();
  if (!title && item.body) {
    title = String(item.body).split(/[。\n]/)[0].trim();
  }
  if (!title && item.date) {
    title = fmtDate(item.date) + ' の投稿';
  }
  const desc = (item.body || title).slice(0, 120);
  updateMeta(title, desc, imgUrl);
  (function() {
    var existing = document.getElementById('blog-jsonld');
    if (existing) existing.remove();
    var sd = document.createElement('script');
    sd.id = 'blog-jsonld';
    sd.type = 'application/ld+json';
    sd.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BlogPosting',
      'headline': title,
      'description': desc,
      'datePublished': item.date || '',
      'image': imgUrl || '',
      'url': SITE_URL + location.pathname + location.search,
      'publisher': {
        '@type': 'Organization',
        'name': STORE_NAME,
        'url': SITE_URL
      }
    });
    document.head.appendChild(sd);
  })();
  root.innerHTML =
    '<article class="card">' +
      (imgUrl ? '<img src="' + esc(imgUrl) + '" alt="' + esc(title) + '" loading="eager">' : '') +
      '<div class="card-body">' +
        (item.date ? '<span class="date">' + esc(fmtDate(item.date)) + '</span>' : '') +
        (item.title && item.title.trim() ? '<h1>' + esc(item.title) + '</h1>' : '') +
        '<p class="text">' + esc(item.body || '') + '</p>' +
      '</div>' +
    '</article>' +
    '<div class="back-wrap">' +
      '<a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a>' +
    '</div>' +
    '<div class="produced-by">' +
      'Produced by <a href="https://search-mania.net/" target="_blank" rel="noopener noreferrer">SearchMania Inc.</a>' +
    '</div>';
}
(function init() {
  const slug = getSlug();
  const n    = getN();
  if (!slug && n < 0) { render(null); return; }
  fetch(GAS_URL + (GAS_URL.indexOf('?') >= 0 ? '&' : '?') + 'blog_all=1')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const item = findBySlug(data && data.blog, slug, n);
      render(item);
    })
    .catch(function(err) {
      console.warn('CMS fetch error:', err);
      fetch(GAS_URL)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          const item = findBySlug(data && data.blog, slug, n);
          render(item);
        })
        .catch(function() { render(null); });
    });
})();
</script>
</body>
</html>
